<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Cortex Connect Interface</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="container my-4">
  <div class="text-center mb-4">
    <h1>HAILR</h1>
  </div>
        <!-- VHF Section -->
          <div class="card h-100">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h2>VHF</h2>
              <div class="status-light processing" id="vhf-status"></div>
            </div>
            <div class="card-body">
              <button id="playButton" class="btn btn-primary mb-3">Listen</button>
              <div class="input-group mb-3">
                <input type="text" class="form-control" id="channelinput" placeholder="Channel" aria-label="VHF channel">
                <div class="input-group-append">
                  <button class="btn btn-primary" id="setchannel" type="button">Set Channel</button>
                </div>
              </div>
              <div class="input-group mb-3">
                <input type="text" class="form-control col-8" placeholder="Message" id="vhfmessage" aria-label="VHF message">
                <input type="text" class="form-control col-3" placeholder="Channel" id="vhfchannel" size="50" aria-label="VHF Channel">
		              <div class="input-group-append">
                  <button class="btn btn-primary" id="vhftansmitbutton" type="button">Transmit</button>
                </div>
              </div>
            </div>
          </div>
</div>

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>
<script src="./node_modules/roslib/build/roslib.js"></script>
<script src="script.js"></script>
</body>
</html>
